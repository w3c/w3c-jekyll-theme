<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}" class="no-js">

{% include head.html %}

<body>
    <a class="skip-link" href="#main">Skip to content</a>
    {% include header.html %}
    <main id="main">
        <h1>{{ page.title | default: site.github.repository_name }}</h1>
        {% if page.toc == true %}
        <nav class="toc" aria-labelledby="toc-label">
            <h2 id="toc-label">Page contents</h2>
            {{ content | toc_only }}
        </nav>
        {% endif %}
        <div class="component">
            {{ content }}
        </div>
        {% include prefooter.html %}
        </main>
    {% include footer.html %}
</body>

</html>
